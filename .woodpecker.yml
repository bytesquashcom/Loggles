when:
  - event: push
    branch: main
  - event: tag

steps:
  # ── Tests ───────────────────────────────────────────────────────────────────
  - name: test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - dotnet restore src/Loggles.Tests/Loggles.Tests.csproj
      - dotnet test src/Loggles.Tests/Loggles.Tests.csproj --configuration Release --no-restore

  # ── Docker: :latest on every merge to main ──────────────────────────────────
  - name: docker-latest
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ghcr.io
      repo: ghcr.io/bytesquashcom/loggles
      username:
        from_secret: GITHUB_USERNAME
      password:
        from_secret: GITHUB_TOKEN
      dockerfile: src/Dockerfile
      context: src/
      tags: latest
    when:
      - event: push
        branch: main

  # ── Docker: versioned tag + :latest (stable) or :beta (pre-release) ─────────
  - name: docker-release
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GITHUB_USERNAME:
        from_secret: GITHUB_USERNAME
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
      - VERSION=${CI_COMMIT_TAG#v}
      - docker build -t "ghcr.io/bytesquashcom/loggles:$VERSION" -f src/Dockerfile src/
      - docker push "ghcr.io/bytesquashcom/loggles:$VERSION"
      - |
        if echo "$CI_COMMIT_TAG" | grep -q -- "-beta"; then
          docker tag "ghcr.io/bytesquashcom/loggles:$VERSION" ghcr.io/bytesquashcom/loggles:beta
          docker push ghcr.io/bytesquashcom/loggles:beta
        else
          docker tag "ghcr.io/bytesquashcom/loggles:$VERSION" ghcr.io/bytesquashcom/loggles:latest
          docker push ghcr.io/bytesquashcom/loggles:latest
        fi
    when:
      - event: tag

  # ── GitHub Release: generate changelog + create release or pre-release ───────
  - name: github-release
    image: alpine:3.21
    environment:
      GH_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - apk add --no-cache github-cli curl tar git
      - curl -sSL "https://github.com/orhun/git-cliff/releases/download/v2.4.0/git-cliff-2.4.0-x86_64-unknown-linux-musl.tar.gz" -o /tmp/git-cliff.tar.gz
      - tar xzf /tmp/git-cliff.tar.gz -C /tmp
      - mv /tmp/git-cliff*/git-cliff /usr/local/bin/git-cliff
      - chmod +x /usr/local/bin/git-cliff
      - git fetch --unshallow || true
      - git-cliff --latest --output RELEASE_NOTES.md
      - |
        if echo "$CI_COMMIT_TAG" | grep -q -- "-beta"; then
          gh release create "$CI_COMMIT_TAG" \
            --repo "bytesquashcom/loggles" \
            --title "$CI_COMMIT_TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
        else
          gh release create "$CI_COMMIT_TAG" \
            --repo "bytesquashcom/loggles" \
            --title "$CI_COMMIT_TAG" \
            --notes-file RELEASE_NOTES.md
        fi
    when:
      - event: tag
